name: Build ImmortalWrt 24.10.6 for H3C NX30 Pro (NMBM)

on:
  workflow_dispatch:
  push:
    paths:
      - 'nx30pro-nmbm.config'
      - '.github/workflows/build-nx30pro.yml'

permissions:
  contents: write

env:
  SRC_TAG: v24.10.6
  UPSTREAM_VERMAGIC: 6.6.133-1-a8b93917f464536104594f27d870028d

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 格式自动对齐与前置检查编码
      # ---------------------------------------------------------------
      - name: Format alignment and config validation
        run: |
          echo "=== 正在执行工作区配置编码清洗与格式标准化 ==="
          find . -type f \( -name "*.yml" -o -name "*.yaml" -o -name "*.config" -o -name "*.sh" \) -print0 | while IFS= read -r -d '' f; do
            sed -i 's/\r$//' "$f"
            sed -i 's/\xc2\xa0/ /g' "$f"
            sed -i 's/[[:space:]]*$//' "$f"
          done

          if [ -f nx30pro-nmbm.config ]; then
            if grep -nE '^[A-Za-z0-9_]+[[:space:]]+=' nx30pro-nmbm.config; then
              echo "::error::nx30pro-nmbm.config 中存在非法空格赋值"
              exit 1
            fi
            echo "配置文件语法检查通过。"
          else
            echo "::error::未检测到 nx30pro-nmbm.config"
            exit 1
          fi

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost \
                      /usr/share/swift \
                      /usr/local/.ghcup 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools python3-pip \
            rsync unzip zip file wget curl ca-certificates ccache \
            device-tree-compiler libelf-dev libtool autoconf automake pkg-config \
            subversion swig texinfo bc cpio squashfs-tools \
            liblzo2-dev libzstd-dev libgmp-dev libmpc-dev libmpfr-dev \
            python3-ply python3-yaml ecj fastjar gcc-multilib g++-multilib \
            nano qemu-utils upx-ucl antlr3 asciidoc intltool help2man jq || true
          ccache --version | head -1

      - name: Clone ImmortalWrt source (${{ env.SRC_TAG }})
        run: |
          git clone --depth=1 -b "${SRC_TAG}" \
            https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          echo "HEAD = $(git rev-parse HEAD)"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/.ccache
            ~/.ccache
          key: ccache-nx30pro-${{ env.SRC_TAG }}-${{ hashFiles('nx30pro-nmbm.config') }}-${{ github.run_number }}
          restore-keys: |
            ccache-nx30pro-${{ env.SRC_TAG }}-${{ hashFiles('nx30pro-nmbm.config') }}-
            ccache-nx30pro-${{ env.SRC_TAG }}-
            ccache-nx30pro-

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 注入 Mihomo 内核（OpenClash 的 feeds 包只带界面与脚本，不含核心二进制）
          # 与上一版注入 Xray 的做法一致：直接取官方预编译产物，绕开 Go 工具链。
          MIHOMO_TAG=$(curl -sL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.tag_name // empty')
          if [ -z "$MIHOMO_TAG" ]; then
            MIHOMO_TAG="v1.19.32"
            echo "::warning::GitHub API 未返回最新 tag，回退到 ${MIHOMO_TAG}"
          fi
          MIHOMO_VER="${MIHOMO_TAG#v}"
          echo "检测到 Mihomo 官方最新版本: ${MIHOMO_VER}"

          PKG_DIR=package/openclash-core
          rm -rf "$PKG_DIR"
          mkdir -p "$PKG_DIR"

          cat << EOF > "$PKG_DIR/Makefile"
          include \$(TOPDIR)/rules.mk

          PKG_NAME:=openclash-core
          PKG_VERSION:=${MIHOMO_VER}
          PKG_RELEASE:=1

          PKG_SOURCE:=mihomo-linux-arm64-v\$(PKG_VERSION).gz
          PKG_SOURCE_URL:=https://github.com/MetaCubeX/mihomo/releases/download/v\$(PKG_VERSION)/
          PKG_HASH:=skip

          PKG_BUILD_DIR:=\$(BUILD_DIR)/\$(PKG_NAME)

          include \$(INCLUDE_DIR)/package.mk

          define Package/openclash-core
            SECTION:=net
            CATEGORY:=Network
            TITLE:=Mihomo Meta core for OpenClash
            URL:=https://github.com/MetaCubeX/mihomo
            DEPENDS:=+luci-app-openclash
          endef

          define Build/Prepare
          	mkdir -p \$(PKG_BUILD_DIR)
          	gzip -dc \$(DL_DIR)/\$(PKG_SOURCE) > \$(PKG_BUILD_DIR)/clash_meta
          	chmod 0755 \$(PKG_BUILD_DIR)/clash_meta
          endef

          define Build/Compile
          endef

          define Package/openclash-core/install
          	\$(INSTALL_DIR) \$(1)/etc/openclash/core
          	\$(INSTALL_BIN) \$(PKG_BUILD_DIR)/clash_meta \$(1)/etc/openclash/core/clash_meta
          endef

          \$(eval \$(call BuildPackage,openclash-core))
          EOF
          sed -i 's/^          //' "$PKG_DIR/Makefile"

      - name: Load config and verify selections
        run: |
          cd openwrt
          cp ../nx30pro-nmbm.config .config
          make defconfig
          grep -q '^CONFIG_HAVE_DOT_CONFIG=y' .config || echo 'CONFIG_HAVE_DOT_CONFIG=y' >> .config

          fail=0
          chk_on() {
            if grep -q "^$1=y" .config; then
              echo "  [OK]      $1"
            else
              echo "  [缺失!!]  $1  ($2)"
              fail=1
            fi
          }
          chk_off() {
            if grep -q "^# $1 is not set" .config; then
              echo "  [已关闭]  $1"
            elif grep -q "^$1=y" .config; then
              echo "  [未关闭!] $1  ($2)"
              fail=1
            else
              echo "  [不适用]  $1"
            fi
          }

          echo "=== 1. 设备与平台 ==="
          chk_on CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_h3c_magic-nx30-pro-nmbm "NX30 Pro NMBM 设备未被选中"
          chk_on CONFIG_TARGET_PER_DEVICE_ROOTFS "未按设备裁剪 rootfs"

          echo "=== 2. 代理组件（OpenClash + Mihomo）==="
          chk_on CONFIG_PACKAGE_luci-app-openclash "OpenClash 界面缺失"
          chk_on CONFIG_PACKAGE_openclash-core "Mihomo 内核缺失，OpenClash 无法启动"
          chk_on CONFIG_PACKAGE_dnsmasq-full "OpenClash 强依赖 dnsmasq-full"
          chk_on CONFIG_PACKAGE_ruby "OpenClash 的订阅转换依赖 ruby"
          chk_on CONFIG_PACKAGE_ruby-yaml "OpenClash 依赖 ruby-yaml"

          # 旧代理插件不应再被任何依赖拉回来
          chk_off CONFIG_PACKAGE_luci-app-passwall "旧版 PassWall 必须关闭"
          chk_off CONFIG_PACKAGE_luci-app-passwall2 "PassWall 2 必须关闭"
          chk_off CONFIG_PACKAGE_xray-core "Xray 已随 PassWall 一并移除"
          chk_off CONFIG_PACKAGE_sing-box "Sing-Box 必须关闭"

          echo "=== 2b. VPN 组网（Tailscale）==="
          chk_on CONFIG_PACKAGE_tailscale "Tailscale 主程序缺失"
          chk_off CONFIG_PACKAGE_zerotier "已改用 Tailscale"
          chk_off CONFIG_PACKAGE_luci-app-zerotier "已改用 Tailscale"

          echo "=== 3. 透明代理内核模块 ==="
          for k in kmod-nft-socket kmod-nft-tproxy kmod-nft-nat; do
            chk_on "CONFIG_PACKAGE_$k" "TProxy 模块缺失"
          done

          if [ "$fail" != "0" ]; then
            echo "::error::配置自检未通过，已中止。"
            exit 1
          fi
          echo "配置自检全部通过。"

      - name: Download package sources
        run: |
          cd openwrt
          make -j$(nproc) download || make -j1 download V=s

      - name: Build firmware
        id: build
        run: |
          cd openwrt
          mkdir -p "$RUNNER_TEMP/blog"
          LOG="$RUNNER_TEMP/blog/build.log"
          rc=0
          if ! make -j$(nproc) > "$LOG" 2>&1; then
            echo "并行编译失败，改用单线程排查..."
            make -j1 V=s >> "$LOG" 2>&1 || rc=1
          fi
          if [ "$rc" = "0" ]; then exit 0; fi

          echo "::error title=编译失败::"
          grep -nE 'make(\[[0-9]+\])?: \*\*\*|Error [0-9]+$|error:|fatal error:' "$LOG" | tail -n 40 || true
          tail -n 60 "$LOG"
          exit 1

      - name: Verify artifacts and report sizes
        id: verify
        run: |
          cd "$GITHUB_WORKSPACE/openwrt"
          BIN=bin/targets/mediatek/filogic
          ls -lh $BIN/*h3c_magic-nx30-pro-nmbm* || true

          find bin/ -name "luci-app-openclash_*.ipk" -print -quit | grep -q . || { echo "::error::luci-app-openclash 未编出"; exit 1; }
          find bin/ -name "openclash-core_*.ipk" -print -quit | grep -q . || { echo "::error::Mihomo 内核未编出"; exit 1; }
          find bin/ -name "tailscale_*.ipk" -print -quit | grep -q . || { echo "::error::tailscale 未编出"; exit 1; }
          echo "产物核实通过！"

      - name: Upload firmware
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-24.10.6-nx30pro-nmbm-${{ github.run_number }}
          path: |
            openwrt/bin/targets/mediatek/filogic/*h3c_magic-nx30-pro-nmbm*
            openwrt/bin/targets/mediatek/filogic/sha256sums
            openwrt/bin/targets/mediatek/filogic/profiles.json
            openwrt/bin/targets/mediatek/filogic/config.custom
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: always() && steps.build.outcome == 'success' && steps.verify.outcome == 'success' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NX30 Pro NMBM build ${{ github.run_number }}
          body: |
            基于 ImmortalWrt ${{ env.SRC_TAG }} 编译的 H3C Magic NX30 Pro（NMBM 布局）固件。

            - **代理插件**：**OpenClash**，预装官方最新 **Mihomo（Meta）内核**，开箱可用。
            - **VPN 组网**：**Tailscale**（已预装，默认未启用，用 `tailscale up` 加入网络）。
            - **DNS**：`dnsmasq-full`，支持 OpenClash 的 nftset 分流。
          prerelease: false
          files: |
            openwrt/bin/targets/mediatek/filogic/*h3c_magic-nx30-pro-nmbm*
